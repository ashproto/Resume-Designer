name: iOS PR TestFlight Feedback Repair

# This dispatch revalidates an existing owner request and repairs its notice.
# It has no Apple access, delivery dependencies, release queue or build inputs.
on:
  workflow_dispatch:
    inputs:
      request_tag:
        description: Original ios-testflight/request/pr-N/comment-ID binding
        required: true
        type: string

permissions:
  contents: read

jobs:
  feedback:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_id == '1163653093' &&
      github.repository_owner_id == '35086581' &&
      github.ref == 'refs/heads/main' &&
      github.event.sender.id == 35086581 &&
      github.triggering_actor == 'ashproto'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted main controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js without caches
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Revalidate the original request and repair only its feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_FEEDBACK_REPAIR: 'true'
        run: node tools/ios-pr-testflight.mjs feedback
